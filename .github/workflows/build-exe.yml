name: Build Windows EXE
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      # 1) single-file BeyondZero.exe
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name BeyondZero --icon assets/icon.ico --add-data "assets;assets" --collect-all arabic_reshaper --collect-all bidi main.py
      - run: Copy-Item dist\BeyondZero.exe BeyondZero_single.exe
      # 2) folder build used by the installer
      - run: pyinstaller --noconfirm --clean --windowed --name BeyondZero --icon assets/icon.ico --add-data "assets;assets" --collect-all arabic_reshaper --collect-all bidi main.py
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: BeyondZero-Windows
          path: |
            BeyondZero_single.exe
            Output/BeyondZero_Setup.exe
